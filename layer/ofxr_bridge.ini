[ofxr]
enabled=1
; ofxr (default), or dlss in a build with the native NVIDIA DLSS FG option.
; Native DLSS needs matching engine motion AND depth guides. Missing/reset
; guides show the current frame. Select through the tray for its cached INI.
frame_generation=ofxr
; Native DLSS FG's resolution, 25 to 100 percent of each eye's. Below 100,
; NVIDIA generates at that size and the bridge restores the real frame's
; detail wherever it can follow the game's motion. 67, the default, erred
; less than 100 on recorded game frames, for less GPU time.
dlssg_resolution=67
motion_vectors=off
backend=nvidia
nvidia_preset=medium
; Optical-flow input scale for either backend: 100, 75 or 50 percent per
; axis. Lower trades motion-vector detail for a cheaper pack and flow, which
; matters at high headset resolutions.
nvidia_input_scale=50
nvidia_bidirectional=0
; In a game with DLSS vectors: 1 runs FidelityFX optical flow as well and
; takes, per pixel, whichever explains both frames better - the best
; quality measured, for about a millisecond more a pair. It takes the
; FidelityFX backend.
dlss_flow_hybrid=0
; 1 shows each real frame at once and then predicts the next display period
; from it, as Application SpaceWarp does, instead of interpolating before it -
; a display period less latency for a prediction's quality. It follows the
; game's DLSS vectors and depth, or FidelityFX optical flow without them, and
; turns deep_pipeline off.
extrapolate=0
; With extrapolate: 1 (default) predicts with Meta's mesh warps - a grid
; moved along the game's vectors and depth as Application SpaceWarp does, or
; along optical flow as Asynchronous SpaceWarp does (with extrapolate=2 the
; vectors' grid asks the flow where it does not explain the frame before) -
; which measured more accurate and cheaper than OFXR's per-pixel gather; 0
; uses the gather. Read when the game starts and again at each change made
; from the tray.
extrapolate_mesh=1
; "Prefer FPS over latency" in the tray: one frame of extra depth for games that
; only just reach half the headset's refresh rate, at about one frame of
; latency. 1 on (default), 0 off. Read when the game starts its session.
deep_pipeline=1
; 1 (default): the display time each game frame is promised follows, in whole
; display periods, when its real frames actually go down, so the game renders
; for the head pose it is shown at instead of leaving the difference to the
; runtime's reprojection. 0 keeps the fixed promise.
promise_shown_time=1
; "3X Frame Gen" in the tray: two generated frames for every game frame, for
; games at a third of the headset's refresh rate. 0 off (default), 1 on.
; Followed live in a running game that started with deep_pipeline=1.
triple_frame_gen=0
; Programs the layer stays out of, by executable name, separated by ';'.
; Pimax Home takes the headset whenever a game leaves VR and would otherwise
; hold the layer's buffers at full resolution the whole time. Leave empty
; to exclude nothing.
excluded_processes=PimaxHome-Win64-Shipping.exe
; One private swapchain per generated output instead of two: fewer images
; held by the runtime (half, and half again on Pimax OpenXR, which keeps a
; copy of every image). 1 on (default), 0 off. Read when the game starts.
single_swapchain_rings=1
; D3D12 games: the layer's copy of each eye image is taken when the game ends
; its frame rather than when it releases the image. A game that releases an
; eye before its rendering has reached the GPU queue otherwise gives the layer
; the previous frame for that eye alone, which shows as flicker in one eye
; (reported in MSFS 2024 with 3X Frame Gen). 1 on (default), 0 off, back to
; capturing at release. Read when the game starts.
capture_at_end_frame=1
; Vulkan games: the game's session is handed to the runtime as a D3D12 one
; and the game renders into shared textures, so the layer keeps no mirrors
; of its images (about half the VRAM of the earlier Vulkan path). 1 on
; (default), 0 off, back to the mirroring path. Read when the game starts.
vulkan_session_bridge=1
; Frame generation for Vulkan games. 1 on (default), 0 off; not in the tray's
; menu, set vulkan_bridge=0 in tray.ini instead. Needs the OFXR Vulkan layer
; registered beside this one, which the tray does while armed with it on.
vulkan_bridge=1
d3d11_bridge=1

[diagnostics]
logging_enabled=0
; Raise for a long capture: at the usual record density 32 MB wraps at about
; ninety seconds and keeps only the tail. Edits here survive arming.
max_file_mb=32
flush_each_event=0

[overlay]
position=upper_right
